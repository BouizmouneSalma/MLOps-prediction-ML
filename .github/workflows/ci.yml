name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run Black (Code Formatting Check)
      run: |
        black --check --diff .
      continue-on-error: true
    
    - name: Run Flake8 (Linting)
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run Pylint
      run: |
        pylint **/*.py --exit-zero --max-line-length=127
      continue-on-error: true

  data-validation:
    name: Data Quality Validation
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Data Validation
      run: |
        python scripts/validate_data.py
    
    - name: Upload Data Validation Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: data-validation-report
        path: reports/data_validation_report.json

  model-training-validation:
    name: Model Training & Validation
    runs-on: ubuntu-latest
    needs: data-validation
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Setup MLflow Tracking
      env:
        MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      run: |
        mkdir -p mlruns
    
    - name: Train Model and Validate Performance
      env:
        MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      run: |
        python scripts/train_and_validate.py
    
    - name: Check Model Performance Threshold
      run: |
        python scripts/check_model_performance.py
    
    - name: Upload Model Metrics Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: model-metrics-report
        path: reports/model_metrics.json
    
    - name: Upload MLflow Artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: mlflow-artifacts
        path: mlruns/

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: model-training-validation
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
    
    - name: Run API Tests
      run: |
        pytest tests/test_api.py -v
      continue-on-error: true
